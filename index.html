<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Love Project</title>
</head>
<body>
    <div class="image">
        <img src="WhatsApp Image 2026-06-03 at 4.43.15 AM.jpeg" alt="ferial photo" class="ferial"/>
    </div>

<div class="question-container container">
<img class="local-gif" src="WhatsApp Image 2026-06-03 at 5.13.54 AM.jpeg" autoplay muted loop></img>
  <h2 class="question"></h2>
  <div class="button-container">
    <button class="yes-btn btn js-yes-btn">Yes</button>
    <button class="no-btn btn js-no-btn">No</button>
  </div>
</div>
<div class="result-container container">
  <img class="gif-result" src="WhatsApp Image 2026-06-03 at 5.08.54 AM.jpeg" autoplay loop />
  <h2>I knew it😍!</h2>
</div>

<div class="cssload-main">
  <div class="cssload-heart">
    <span class="cssload-heartL"></span>
    <span class="cssload-heartR"></span>
    <span class="cssload-square"></span>
  </div>
  <div class="cssload-shadow"></div>
</div>
<script src="script.js"></script>

</body>
</html>
